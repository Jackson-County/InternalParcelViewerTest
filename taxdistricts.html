<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
		<title>2D Map Template (Parcel Search Only)</title>
		<link rel="stylesheet" href="css/main.css" />

		<!-- Calcite + ArcGIS ESM -->
		<script type="module" src="https://js.arcgis.com/calcite-components/3.3.3/calcite.esm.js"></script>
		<link rel="stylesheet" href="https://js.arcgis.com/calcite-components/3.3.3/calcite.css" />
		<script src="https://js.arcgis.com/4.34/"></script>
		<script type="module" src="https://js.arcgis.com/4.34/map-components/"></script>
	</head>

	<body>
		<header>
			<img src="https://jcgis.jacksongov.org/images/largelogo.png" alt="Logo">
				<h2>Map Viewer Template</h2>
				<arcgis-search id="search" include-default-sources-disabled=""></arcgis-search>
				<button id="functionsButton" class="header-icon-btn" title="Functions">
				<calcite-icon icon="app-gear" scale="m"></calcite-icon>Functions
		</button>
			</header>

	<div id="ui-container">
		<!-- LEFT SIDEBAR -->
		<div id="left-sidebar">

			<!-- SPECIAL TAX DISTRICTS -->
            <div>
				<calcite-combobox placeholder="Select a field" selection-display="single" select-all-enabled>
					<calcite-combobox-item-group id="cid-names" label="CID"></calcite-combobox-item-group>
					<calcite-combobox-item-group id="tdd-names" label="TDD"></calcite-combobox-item-group>
					<calcite-combobox-item-group id="tifproj-names" label="TIF Projects"></calcite-combobox-item-group>
					<calcite-combobox-item-group id="tifplan-names" label="TIF Plan District"></calcite-combobox-item-group>
				</calcite-combobox>
            </div>
		</div>
        <!-- MAP -->
		<calcite-panel class="map-panel">
		<arcgis-map id="map" item-id="715b4ef93362498e97db7393dc2b7d17">
			<arcgis-layer-list slot="top-right"></arcgis-layer-list>
		</arcgis-map>
		</calcite-panel>
		<!--Table-->
		<calcite-panel class="table-panel">
			<arcgis-feature-table
			id="parcelsTable"
			reference-element="map"
			hide-selection-column>
			</arcgis-feature-table>
		</calcite-panel>	


		<!--Functions Button-->
		<calcite-dialog id="functionsDialog" modal>
		<h3 slot="heading">Tools & Functions</h3>
		<div style="padding: 6px;">
			<calcite-card>
				<h4 slot="title">Coming Soon</h4>
				<p slot="subtitle">Additional tools will appear here.</p>

				<p>
					This dialog will eventually hold functions like district filters,
					labeling tools, visibility toggles, and more.
				</p>

				<calcite-chip color="blue" outline>
					Future Feature
				</calcite-chip>
			</calcite-card>
		</div>

		<calcite-button slot="footer-end" appearance="outline">Close</calcite-button>
	</calcite-dialog>
	</div>

		<footer>
			&copy; 2025 - Jackson County Missouri GIS
			<img src="https://jcgis.jacksongov.org/images/Icons/globe-glow.svg"
				alt="Globe Icon"
				style="width:20px;height:20px;vertical-align:text-bottom;margin-left:1px;filter:invert(70%);">
			</footer>

		<script type="module">
			const [SearchSource, Graphic, FeatureFilter, FeatureLayer, reactiveUtils] = await $arcgis.import([
			"@arcgis/core/widgets/Search/SearchSource.js",
			"@arcgis/core/Graphic.js",
			"@arcgis/core/layers/support/FeatureFilter.js",
			"@arcgis/core/layers/FeatureLayer.js",
			"@arcgis/core/core/reactiveUtils.js"
			
			]);

			const mapEl = document.getElementById("map");
			await mapEl.viewOnReady();
			const view = mapEl.view;
			const map = view.map;
			const functionsButton=document.getElementById("functionsButton");
			const functionsDialog=document.getElementById("functionsDialog");
			const tableElement = document.querySelector("arcgis-feature-table");

			functionsButton.addEventListener("click",() =>{
				functionsDialog.open=true;
			});


			// Wait until layers load
			await view.when();
			await map.when();

			// Find the "Parcels" layer
			// Using your current title from the scene example:
			const parcelLayer = map.allLayers.find(l => l.title === "Parcels");
			await parcelLayer.load();

			tableElement.layer = parcelLayer;

			// Custom layer-only search source
			const parcelSearchSource = new SearchSource({
			placeholder: "Search Parcels by Name",
			getSuggestions: async (params) => {
			const res = await parcelLayer.queryFeatures({
			where: `UPPER(Name) LIKE UPPER('%${params.suggestTerm.replace(/'/g, "''")}%')`,
			outFields: ["OBJECTID", "Name"],
			returnGeometry: false
			});

			return res.features.map(f => ({
			key: f.attributes.OBJECTID,
			text: f.attributes.Name,
			sourceIndex: params.sourceIndex
			}));
			},
			getResults: async (params) => {
			const where = params.suggestResult?.key
			? `OBJECTID = ${params.suggestResult.key}`
			: `UPPER(Name) LIKE UPPER('%${params.searchTerm.replace(/'/g, "''")}%')`;

			const res = await parcelLayer.queryFeatures({
			where,
			outFields: ["OBJECTID", "Name"],
			returnGeometry: true
			});

			return res.features.map(f => ({
			name: f.attributes.Name,
			feature: f
			}));
			}
			});

			const searchEl = document.getElementById("search");
			searchEl.sources = [parcelSearchSource];

			// On select/search complete: zoom + highlight
			searchEl.addEventListener("arcgisSearchComplete", async (evt) => {
			const result = evt.detail?.results?.[0]?.results?.[0];
			if (!result) return;

			const feature = result.feature;

			view.graphics.removeAll();
			view.graphics.add(new Graphic({
			geometry: feature.geometry,
			symbol: {
			type: "simple-fill",
			color: [0, 255, 255, 0.4],
			outline: { color: [0, 255, 255], width: 2 }
			}
			}));

			await view.goTo(feature.geometry.extent.expand(2));
			});

			//Dynamically populate combobox groups w/ Name values
			async function populateComboboxGroup({
				layerTitle,
				fieldName,
				groupId,
				valuePrefix
			}) {
				const layer = map.allLayers.find(l => l.title === layerTitle);

				if (!layer) {
				console.warn(`Layer not found: ${layerTitle}`);
				return;
				}

				await layer.load();

				const query = layer.createQuery();
				query.outFields = [fieldName];
				query.returnDistinctValues = true;
				query.where = "1=1";

				const { features } = await layer.queryFeatures(query);

				const values = features
				.map(f => f.attributes[fieldName])
				.filter(v => v != null)
				.sort((a, b) => a.localeCompare(b));

				const groupEl = document.getElementById(groupId);

				values.forEach(value => {
				const item = document.createElement("calcite-combobox-item");
				item.value = `${valuePrefix}:${value}`;
				item.textLabel = value;
				groupEl.appendChild(item);
				});
			}

			// Populate combobox groups
			await populateComboboxGroup({
				layerTitle: "CID",
				fieldName: "Name",
				groupId: "cid-names",
				valuePrefix: "CID"
			});

			await populateComboboxGroup({
				layerTitle: "TDD",
				fieldName: "Name",
				groupId: "tdd-names",
				valuePrefix: "TDD"
			});

			await populateComboboxGroup({
				layerTitle: "TIF Projects",
				fieldName: "Name",
				groupId: "tifproj-names",
				valuePrefix: "TIF_PROJECT"
			});

			await populateComboboxGroup({
				layerTitle: "TIF Plan District",
				fieldName: "Name",
				groupId: "tifplan-names",
				valuePrefix: "TIF_PLAN"
			});		
		</script>
	</body>
</html>
